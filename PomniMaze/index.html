<!DOCTYPE html>

<head>
    <title>Play Time with Pomni</title>
    <meta charset="UTF8" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/index.css" />
</head>

<body>
    <header>
        <h1>I love you Pomni!
        </h1>
        <div id="timer-panel">
            <img id="caine-logo" src="images/caine_01.png">
            <h2 id="timer"></h2>
            <h2>s</h2>
        </div>
    </header>
    <main>
        <section>
            <img id="pomni-logo2" src="images/pomni_02.png">
            <p class="pe-4"> Girl Pomni
            </p>
            <p id="do-it"></p>
        </section>
        <section class="my-5">
            <p class="pe-2" id="do-it-times"></p>
            <p>Time(s)</p>
        </section>
        <section>
            <p id="stopwatch-time"></p>
            <p>Time</p>
            <p id="stopwatch">0:00</p><span id="result"></span>
        </section>
    </main>
    <footer class="d-flex justify-content-between">
        <!-- <h2>This is a Footer</h2> -->
        <div>
            <h5>Pomni Do Something!</h5>
            <button id="lets-go-button">Lets Go!</button>
            <button id="reset-button">Reset</button>
        </div>
        <div>
            <h5>Pomni Maze</h5>
            <button id="start-button">Start</button>
            <button id="stop-button">Stop</button>
            <button id="clear-button">Clear</button>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/index.js"></script>
</body>

</html>
